<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZUF 2026 QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .card {
    background: #fff;
    border: 3px solid #8B0000;
    border-radius: 16px;
    padding: 36px 44px 28px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
    max-width: 420px;
    width: 100%;
  }

  .logo { font-size: 2.4rem; margin-bottom: 4px; }

  h1 {
    color: #8B0000;
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: .3px;
    margin-bottom: 2px;
  }

  .sub {
    color: #555;
    font-size: .95rem;
    margin-bottom: 22px;
  }

  #qr {
    display: inline-block;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #eee;
    margin-bottom: 18px;
  }

  .url-label {
    font-size: .72rem;
    color: #999;
    word-break: break-all;
    margin-bottom: 18px;
    font-family: monospace;
  }

  .cta {
    background: #8B0000;
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 8px;
    letter-spacing: .4px;
    display: inline-block;
    margin-bottom: 12px;
  }

  .date-line {
    font-size: .85rem;
    color: #888;
    margin-top: 6px;
  }

  /* Print: hide everything except the card */
  @media print {
    body { padding: 0; min-height: unset; }
    .card { border: 2px solid #8B0000; box-shadow: none; }
    .no-print { display: none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">⛪</div>
  <h1>Zion Unity Fest 2026</h1>
  <p class="sub">Volunteer Signup Portal</p>

  <div id="qr"></div>

  <p class="url-label">atypicaltek.github.io/ZUF2026-2/ZUF2026_Portal.html</p>

  <div class="cta">Scan to Sign Up!</div>
  <div class="date-line">📅 October 4, 2026</div>
</div>

<p class="no-print" style="margin-top:24px;font-size:12px;color:#aaa">
  Ctrl+P / Cmd+P to print &nbsp;·&nbsp; Right-click the QR code &rarr; "Save image" to export as PNG
</p>

<script>
  new QRCode(document.getElementById('qr'), {
    text:           'https://atypicaltek.github.io/ZUF2026-2/ZUF2026_Portal.html',
    width:          220,
    height:         220,
    colorDark:      '#8B0000',
    colorLight:     '#ffffff',
    correctLevel:   QRCode.CorrectLevel.H
  });
</script>

</body>
</html>
